# Clash Mi / Mihomo full-profile template.
# Replace the URL below with a Clash/Mihomo YAML subscription URL before importing.
# Unlike FlClash, this file is native YAML and uses Mihomo proxy-provider filters.

proxy-providers:
  subscription:
    type: http
    url: "PASTE_YOUR_CLASH_MI_COMPATIBLE_SUBSCRIPTION_URL_HERE"
    path: ./proxy-providers/subscription.yaml
    interval: 3600
    proxy: DIRECT
    exclude-filter: '剩余|流量|套餐|到期|更新|订阅|群组|重置|官网|^(直连|拒绝|DIRECT|REJECT)$'
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204

proxy-groups:
  - name: "自动"
    type: url-test
    include-all: true
    exclude-filter: '(^|[^0-9])0\.[0-9]+(x|倍)?($|[^0-9])'
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    empty-fallback: "全部节点"
  - name: "低倍"
    type: url-test
    include-all: true
    filter: '(^|[^0-9])0\.[0-9]+(x|倍)?($|[^0-9])'
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    empty-fallback: "全部节点"
  - name: "手动"
    type: select
    proxies: ["低倍", "自动", "直连", "拒绝"]
    include-all: true
  - name: "广告"
    type: select
    proxies: ["拒绝", "直连"]
  - name: "AI"
    type: select
    proxies: ["手动", "低倍", "自动", "直连", "拒绝"]
    include-all: true
    exclude-filter: '(?i)香港|hk|hong kong'
  - name: "流媒"
    type: select
    proxies: ["手动", "低倍", "自动", "直连", "拒绝"]
    include-all: true
  - name: "谷歌"
    type: select
    proxies: ["手动", "低倍", "自动", "直连", "拒绝"]
    include-all: true
  - name: "TG"
    type: select
    proxies: ["手动", "低倍", "自动", "直连", "拒绝"]
    include-all: true
  - name: "微软"
    type: select
    proxies: ["直连", "低倍", "自动", "拒绝"]
    include-all: true
  - name: "国内"
    type: select
    proxies: ["直连", "低倍", "自动", "拒绝"]
    include-all: true
  - name: "海外"
    type: select
    proxies: ["手动", "低倍", "自动", "直连", "拒绝"]
    include-all: true
  - name: "漏网之鱼"
    type: select
    proxies: ["直连", "手动", "低倍", "自动", "拒绝"]
    include-all: true
  - name: "全部节点"
    type: url-test
    include-all: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    hidden: true
  - name: "直连"
    type: select
    proxies: [DIRECT]
  - name: "拒绝"
    type: select
    proxies: [REJECT]

rule-providers:
  antiAdRules:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-clash.yaml
    path: ./ruleset/anti-ad-clash.yaml
    interval: 86400
    proxy: "自动"
  adDomainRules:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt
    path: ./ruleset/reject.txt
    interval: 86400
    proxy: "自动"
  directRules:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/wsq0102/config/master/direct.yaml
    path: ./ruleset/direct.yaml
    interval: 86400
    proxy: "自动"
  proxyRules:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/wsq0102/config/master/proxy.yaml
    path: ./ruleset/proxy.yaml
    interval: 86400
    proxy: "自动"

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  respect-rules: true
  proxy-server-nameserver: [223.5.5.5, 114.114.114.114]
  nameserver: [223.5.5.5, 114.114.114.114, 119.28.28.28]
  fallback: [223.6.6.6, 114.114.115.115]
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - localhost
    - time.*
    - time.*.com
    - ntp.*
    - ntp.*.com

